[build-system]
requires = ["setuptools==80.0.0"]
build-backend = "setuptools.build_meta"
[project]
name = "nlp-application-suite"
version = "1.0.0"
description = "Transparent NLP baselines, transformer comparison, and reproducible evaluation"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "python-multipart==0.0.20", "pydantic==2.13.5"]
[project.optional-dependencies]
ml = ["transformers==4.51.3", "torch==2.7.0", "datasets==3.5.0", "scikit-learn==1.6.1", "matplotlib==3.10.1", "numpy==2.2.5"]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8", "mypy==1.15.0"]
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires network and model downloads"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["app", "scripts"]
